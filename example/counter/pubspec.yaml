name: counter
description: Counter example app demonstrating jaspr_bloc usage.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.8

dependencies:
  bloc: ^9.2.1
  jaspr: ^0.23.1
  jaspr_bloc:
    path: ../..

dev_dependencies:
  build_runner: ^2.4.0
  jaspr_builder: ^0.23.1
  jaspr_lints: ^0.7.1
  lints: ^6.1.0

jaspr:
  mode: static
